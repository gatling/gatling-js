name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

defaults:
  run:
    shell: bash

env:
  # @gatling.io packages published to npm, in publication order
  JS_PACKAGES: "cli jvm-types core http graphql jdbc jms grpc kafka mqtt"

jobs:
  check-prerequisites:
    name: Check prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Trusted publishing can only be configured for packages which already exist on npm
      - name: Check JS packages exist on npm
        run: |
          failed=false
          for pkg in $JS_PACKAGES; do
            status=$(curl \
              --location \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "https://registry.npmjs.org/@gatling.io%2F$pkg")
            if [[ "$status" = "200" ]]; then
              echo "@gatling.io/$pkg exists on npm"
            elif [[ "$status" = "404" ]]; then
              echo "::error::@gatling.io/$pkg does not exist on npm, publish a placeholder version and configure trusted publishing first (see `prepare-publish-new-npm-pkg.sh --help`)"
              failed=true
            else
              echo "::error::Failed to check @gatling.io/$pkg on npm (HTTP status $status)"
              failed=true
            fi
          done
          if [[ "$failed" = "true" ]]; then
            exit 1
          fi

  release-jvm:
    name: Release JVM
    needs: check-prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_OPTS: "-Xmx4G"
      SBT_OPTS: "-Dsbt.ci=true"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials (for CodeArtifact)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PROD_GATLING_JS }}
          aws-region: us-east-1

      - name: Prepare sbt environment
        env:
          PRIVATE_REPOSITORY_SBT: ${{ vars.PRIVATE_REPOSITORY_SBT_2 }}
        run: |
          mkdir --parents ~/.config/sbt/2 || true
          echo "$PRIVATE_REPOSITORY_SBT" > ~/.config/sbt/2/privateRepository.sbt

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build JS polyfills
        working-directory: ./polyfills
        run: |
          npm ci
          npm run build

      - name: Deploy Java adapter
        id: deploy-jvm
        working-directory: ./jvm
        run: |
          sbt "project gatling-jvm-to-js-adapter;" "testFull;" "gatlingPublish"

      - name: Set version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "version=$version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jvm-workdir
          include-hidden-files: true
          path: |
            .
            !.git/
          retention-days: 7

  release-js:
    name: Release JS
    needs: release-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/org/gatling.io
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jvm-workdir

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: Deploy JS packages
        working-directory: ./js
        env:
          VERSION: ${{ needs.release-jvm.outputs.version }}
        run: |
          npm ci
          npm version "$VERSION"
          npm run build --workspaces
          for pkg in $JS_PACKAGES; do
            cp ../LICENSE "./$pkg/LICENSE"
            npm publish --access public "--workspace=@gatling.io/$pkg"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-js-workdir
          include-hidden-files: true
          path: |
            .
            !.git/
          retention-days: 7

  create-github-release:
    name: Create GitHub release (draft)
    needs:
      - release-jvm
      - release-js
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: GitHub release (draft)
      url: ${{ steps.release.outputs.html_url }}
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      url: ${{ steps.release.outputs.url }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Create GitHub release (draft)
        id: release
        env:
          version: ${{ needs.release-jvm.outputs.version }}
          RELEASES_URL: ${{ github.event.repository.releases_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$version" =~ -M[0-9]+$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "prerelease=$prerelease"
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          releases_url=$(echo "$RELEASES_URL" | sed 's/{\/id}//')
          response=$(curl \
            --fail-with-body \
            --location \
            --show-error \
            --silent \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$releases_url" \
            --data @- <<EOF
          {
            "name": "Gatling JS $version",
            "tag_name": "$TAG",
            "body": "To get started with Gatling JS, please check [the tutorial](https://docs.gatling.io/tutorials/scripting-intro-js/).\n\nThe bundle files in this release are normally automatically downloaded by the Gatling JS CLI. If you need to perform a manual install, please refer to [the documentation](https://docs.gatling.io/reference/integrations/build-tools/js-cli/).",
            "draft": true,
            "prerelease": $prerelease
          }
          EOF
          )
          echo "response=$response"
          url=$(echo "$response" | jq --raw-output ".url")
          echo "url=$url"
          echo "url=$url" >> $GITHUB_OUTPUT
          html_url=$(echo "$response" | jq --raw-output ".html_url")
          echo "html_url=$html_url"
          echo "html_url=$html_url" >> $GITHUB_OUTPUT
          upload_url=$(echo "$response" | jq --raw-output ".upload_url")
          echo "upload_url=$upload_url"
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT

  update-gatling-postman:
    name: Update Gatling Postman project
    needs:
      - release-jvm
      - release-js
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-jvm.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gatling-js
          sparse-checkout: jvm/build.sbt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The token is only exposed to the step which pushes, not to npm
      - name: Checkout Gatling Postman
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gatling/gatling-postman
          token: ${{ secrets.GATLING_CI_TOKEN }}
          path: gatling-postman
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Update npm
        run: npm install -g npm@latest

      - name: Update Gatling JS version
        id: update
        working-directory: ./gatling-postman
        run: |
          if [[ "$VERSION" = *-* ]]; then
            echo "::notice::Gatling Postman is not updated to milestone versions"
            exit 0
          fi
          gatling_version=$(sed --quiet --regexp-extended 's/^val gatlingVersion = "([^"]+)"$/\1/p' ../gatling-js/jvm/build.sbt)
          echo "gatling_version=$gatling_version"
          if [[ -z "$gatling_version" ]]; then
            echo "::error::Failed to read gatlingVersion from jvm/build.sbt"
            exit 1
          fi
          sed --in-place --regexp-extended \
            "s/(\"@gatling\.io\/jvm-types\": )\"[^\"]*\"/\1\"$VERSION\"/" \
            dependencies/package.json
          sed --in-place --regexp-extended \
            "s/(\"@gatling\.io\/(core|http)\": )\"[^\"]*\"/\1\"$VERSION\"/" \
            js/package.json
          sed --in-place --regexp-extended \
            --expression "s/(gatlingOssVersion = )\"[^\"]*\"/\1\"$gatling_version\"/" \
            --expression "s/(gatlingPrivateVersion = )\"[^\"]*\"/\1\"$gatling_version.FL\"/" \
            --expression "s/(gatlingJsVersion = )\"[^\"]*\"/\1\"$VERSION\"/" \
            jvm/project/Dependencies.scala
          # Fail if a replacement did not apply, e.g. because a file format changed
          if ! jq --exit-status --arg v "$VERSION" '.devDependencies["@gatling.io/jvm-types"] == $v' dependencies/package.json > /dev/null \
            || ! jq --exit-status --arg v "$VERSION" '.dependencies["@gatling.io/core"] == $v and .dependencies["@gatling.io/http"] == $v' js/package.json > /dev/null \
            || ! grep --quiet --fixed-strings "gatlingOssVersion = \"$gatling_version\"" jvm/project/Dependencies.scala \
            || ! grep --quiet --fixed-strings "gatlingPrivateVersion = \"$gatling_version.FL\"" jvm/project/Dependencies.scala \
            || ! grep --quiet --fixed-strings "gatlingJsVersion = \"$VERSION\"" jvm/project/Dependencies.scala; then
            git diff
            echo "::error::Failed to update Gatling JS version"
            exit 1
          fi
          if git diff --quiet; then
            echo "::notice::Gatling Postman already uses Gatling JS $VERSION"
            exit 0
          fi
          echo "updated=true" >> $GITHUB_OUTPUT

      # npm scans newly published packages before making them available, which usually takes a few minutes
      - name: Wait for npm packages
        if: ${{ steps.update.outputs.updated == 'true' }}
        timeout-minutes: 20
        run: |
          for pkg in jvm-types core http; do
            until [[ "$(npm view "@gatling.io/$pkg@$VERSION" version 2> /dev/null)" = "$VERSION" ]]; do
              echo "Waiting for @gatling.io/$pkg@$VERSION to be available on npm..."
              sleep 15
            done
            echo "@gatling.io/$pkg@$VERSION is available on npm"
          done

      - name: Update npm dependencies
        if: ${{ steps.update.outputs.updated == 'true' }}
        working-directory: ./gatling-postman
        run: |
          for project in dependencies js; do
            (
              cd "$project"
              npm install --ignore-scripts
              npm update --ignore-scripts
            )
          done

      - name: Create pull request
        if: ${{ steps.update.outputs.updated == 'true' }}
        working-directory: ./gatling-postman
        env:
          GH_TOKEN: ${{ secrets.GATLING_CI_TOKEN }}
          COMMIT_AUTHOR_EMAIL: ${{ vars.GATLING_CI_EMAIL }}
          COMMIT_AUTHOR_NAME: ${{ vars.GATLING_CI_NAME }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="chore/upgrade-gatling-js-$VERSION"
          title="chore: upgrade gatling-js to $VERSION"
          pr_url=$(gh pr list --head "$branch" --json url --jq ".[0].url // empty")
          if [[ -n "$pr_url" ]]; then
            echo "::notice::Pull request already exists: $pr_url"
            exit 0
          fi
          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          git switch --create "$branch"
          git commit --all --message "$title"
          gh auth setup-git
          # No pull request uses this branch, so a leftover from a previous attempt can be overwritten
          git push --force origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" --title "$title" --body "Created by the Gatling JS release workflow: $RUN_URL")
          echo "::notice::Pull request created: $pr_url"

  build-linux-x64:
    name: Build bundle for Linux x64
    needs:
      - release-jvm
      - create-github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-js-workdir

      - name: Build and upload bundle
        uses: ./.github/actions/build-and-upload-bundle
        with:
          version: ${{ needs.release-jvm.outputs.version }}
          upload-url: ${{ needs.create-github-release.outputs.upload_url }}
          os-type: Linux
          os-arch: x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-role: ${{ vars.AWS_ROLE_PROD_GATLING_JS }}

  build-linux-arm64:
    name: Build bundle for Linux ARM64
    needs:
      - release-jvm
      - create-github-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-js-workdir

      - name: Build and upload bundle
        uses: ./.github/actions/build-and-upload-bundle
        with:
          version: ${{ needs.release-jvm.outputs.version }}
          upload-url: ${{ needs.create-github-release.outputs.upload_url }}
          os-type: Linux
          os-arch: arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-role: ${{ vars.AWS_ROLE_PROD_GATLING_JS }}

  build-macos-arm64:
    name: Build bundle for macOS ARM64
    needs:
      - release-jvm
      - create-github-release
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-js-workdir

      - name: Build and upload bundle
        uses: ./.github/actions/build-and-upload-bundle
        with:
          version: ${{ needs.release-jvm.outputs.version }}
          upload-url: ${{ needs.create-github-release.outputs.upload_url }}
          os-type: Darwin
          os-arch: arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-role: ${{ vars.AWS_ROLE_PROD_GATLING_JS }}

  build-windows-x64:
    name: Build bundle for Windows x64
    needs:
      - release-jvm
      - create-github-release
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-js-workdir

      - name: Build and upload bundle
        uses: ./.github/actions/build-and-upload-bundle
        with:
          version: ${{ needs.release-jvm.outputs.version }}
          upload-url: ${{ needs.create-github-release.outputs.upload_url }}
          os-type: Windows_NT
          os-arch: x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-role: ${{ vars.AWS_ROLE_PROD_GATLING_JS }}

  publish-github-release:
    name: Publish GitHub release
    needs:
      - create-github-release
      - build-linux-x64
      - build-linux-arm64
      - build-macos-arm64
      - build-windows-x64
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: GitHub release
      url: ${{ steps.release.outputs.html_url }}
    steps:
      - name: Publish GitHub release
        id: release
        env:
          prerelease: ${{ needs.create-github-release.outputs.prerelease }}
          URL: ${{ needs.create-github-release.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$prerelease" = "true" ]]; then
            make_latest=false
          else
            make_latest=true
          fi
          response=$(curl \
            --fail-with-body \
            --location \
            --show-error \
            --silent \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" \
            --data @- <<EOF
          {
            "draft": false,
            "make_latest": $make_latest
          }
          EOF
          )
          echo "response=$response"
          html_url=$(echo "$response" | jq --raw-output ".html_url")
          echo "html_url=$html_url"
          echo "html_url=$html_url" >> $GITHUB_OUTPUT
