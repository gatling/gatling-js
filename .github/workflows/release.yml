name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release-jvm:
    name: Release JVM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_OPTS: "-Xmx4G"
      SBT_OPTS: "-Dsbt.ci=true"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials (for CodeArtifact)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PROD_GATLING_JS }}
          aws-region: us-east-1

      - name: Prepare sbt environment
        env:
          PRIVATE_REPOSITORY_SBT: ${{ vars.PRIVATE_REPOSITORY_SBT_2 }}
        run: |
          mkdir --parents ~/.config/sbt/2 || true
          echo "$PRIVATE_REPOSITORY_SBT" > ~/.config/sbt/2/privateRepository.sbt

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up sbt
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build JS polyfills
        working-directory: ./polyfills
        run: |
          npm ci
          npm run build

      - name: Deploy Java adapter
        id: deploy-jvm
        working-directory: ./jvm
        run: |
          sbt "project gatling-jvm-to-js-adapter;" "set publishTo := gatlingMilestonesRepository.value;" "testFull;" "gatlingPublish"

      - name: Set version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "version=$version"
          echo "version=$version" >> $GITHUB_OUTPUT
