name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAVA_OPTS: "-Xmx4G"
      SBT_OPTS: "-Dsbt.ci=true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up sbt
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build JS polyfills
        working-directory: ./polyfills
        run: |
          npm ci
          npm run format-check
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PROD_GATLING_JS }}
          aws-region: us-east-1

      - name: Prepare sbt environment
        env:
          PRIVATE_REPOSITORY_SBT: ${{ vars.PRIVATE_REPOSITORY_SBT_2 }}
        run: |
          mkdir --parents ~/.config/sbt/2 || true
          echo "$PRIVATE_REPOSITORY_SBT" > ~/.config/sbt/2/privateRepository.sbt

      - name: Build JVM projects
        working-directory: ./jvm
        run: |
          sbt \
            "project gatling-jvm-to-js-adapter;" \
            "scalafmtSbtCheck;" \
            "headerCheckAll;" \
            "javafmtCheckAll;" \
            "scalafmtCheckAll;" \
            "scalafixAll --check;" \
            "compile;" \
            "testFull;"

      - name: Build JS projects
        working-directory: ./js
        run: |
          npm ci
          npm run format-check --workspaces
          npm run build --workspaces
